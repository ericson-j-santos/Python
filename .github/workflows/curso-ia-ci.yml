name: Curso IA - verificacao publica
on:
  pull_request:
    paths:
      - "curso_ia/**"
      - ".github/workflows/curso-ia-ci.yml"
  push:
    branches: [master]
    paths:
      - "curso_ia/**"
      - ".github/workflows/curso-ia-ci.yml"
permissions:
  contents: read
jobs:
  testar_codigo_publico:
    name: "Curso IA - testes sem dados privados"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Obter codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Instalar dependencia de testes
        run: python -m pip install --disable-pip-version-check --no-input pytest==9.0.2
      - name: Verificar sintaxe dos fontes
        run: python -m compileall -q curso_ia
      - name: Executar testes sem material privado
        run: python -m pytest -q curso_ia/tests/test_ferramentas.py curso_ia/tests/test_validar_clusters_publico.py
